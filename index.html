<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富途账户页面</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
body{background:#121212;color:#fff;padding:16px;}
.card{background:#1e1e1e;border-radius:14px;padding:20px;max-width:420px;margin:0 auto;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.title{font-size:18px;font-weight:bold;}
.balance{font-size:32px;font-weight:bold;margin:12px 0;}
.up{color:#52c41a;}
.down{color:#ff4d4f;}
.info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #333;}
.label{color:#aaa;}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="title">资产概览</div>
  </div>
  <div class="balance">¥ 1,286,520.00</div>
  <div class="info-row">
    <span class="label">今日盈亏</span>
    <span class="up">+¥28,630.00</span>
  </div>
  <div class="info-row">
    <span class="label">持仓市值</span>
    <span>¥ 1,020,100.00</span>
  </div>
  <div class="info-row">
    <span class="label">可用资金</span>
    <span>¥ 266,420.00</span>
  </div>
  <div class="info-row">
    <span class="label">总盈亏</span>
    <span class="up">+¥326,800.00</span>
  </div>
</div>
</body>
</html>
